name: Temporary tiny Whisper model artifact

on:
  pull_request:
    paths:
      - 'tmp-tiny-model-trigger.txt'

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official multilingual tiny q5 model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          curl -L --fail --retry 5 --retry-all-errors --silent --show-error \
            -o model/ggml-tiny-q5_1.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin?download=true'
          test "$(stat -c '%s' model/ggml-tiny-q5_1.bin)" -gt 20000000
          sha256sum model/ggml-tiny-q5_1.bin | tee model/SHA256SUMS.txt

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model-tiny-q5_1
          path: model/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
