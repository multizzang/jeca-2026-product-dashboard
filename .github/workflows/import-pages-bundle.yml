name: Import JECA Pages bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download prepared docs bundle
        run: |
          curl -fL "https://tmpfiles.org/dl/wVwWwin3dxox/jeca-pages-bundle.zip" -o /tmp/jeca-pages-bundle.zip
          unzip -q /tmp/jeca-pages-bundle.zip -d /tmp/jeca-pages-bundle

      - name: Replace Pages files
        run: |
          rm -rf docs README.md .gitignore
          cp -R /tmp/jeca-pages-bundle/docs ./docs
          cp /tmp/jeca-pages-bundle/README.md ./README.md
          cp /tmp/jeca-pages-bundle/.gitignore ./.gitignore
          rm -f .github/workflows/import-pages-bundle.yml

      - name: Commit Pages dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .gitignore docs .github/workflows/import-pages-bundle.yml
          git commit -m "Build JECA 2026 GitHub Pages dashboard" || exit 0
          git push
