name: Temporary Seoul pole diagnosis split ASR

on:
  pull_request:
    paths:
      - 'tmp-seoul-pole-asr-split-trigger.txt'

permissions:
  contents: read

env:
  MODEL_NAME: ggml-small-q5_1.bin

jobs:
  transcribe-slice:
    name: ASR slice ${{ matrix.key }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - key: p0
            start: 0
            duration: 480
          - key: p1
            start: 480
            duration: 480
          - key: p2
            start: 960
            duration: 480
          - key: p3
            start: 1440
            duration: 480
          - key: p4
            start: 1920
            duration: 485

    steps:
      - name: Install runtime and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg cmake build-essential git curl openssl
          python -m pip install --quiet --upgrade pip gdown

      - name: Download and slice source audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/chunks work/model work/output work/secure
          gdown '1Vrj1V0RXB-hTmpmz3wju670vVxvUmyxE' -O work/input.m4a
          test -s work/input.m4a
          ffmpeg -hide_banner -loglevel error -y \
            -ss '${{ matrix.start }}' -t '${{ matrix.duration }}' -i work/input.m4a \
            -af 'highpass=f=80,lowpass=f=7600,dynaudnorm=f=150:g=15' \
            -ar 16000 -ac 1 -c:a pcm_s16le \
            -f segment -segment_time 30 -reset_timestamps 1 \
            work/chunks/chunk_%04d.wav
          find work/chunks -type f -name 'chunk_*.wav' -size +1000c | sort > work/output/chunk-list.txt
          test -s work/output/chunk-list.txt
          printf '%s\n' '${{ matrix.start }}' > work/output/absolute-offset-seconds.txt
          printf '%s\n' '${{ matrix.duration }}' > work/output/slice-duration-seconds.txt
          sha256sum work/input.m4a > work/output/source-audio.sha256

      - name: Build whisper.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.8.4 https://github.com/ggml-org/whisper.cpp.git work/whisper.cpp >/dev/null 2>&1
          cmake -S work/whisper.cpp -B work/whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=OFF >/dev/null
          cmake --build work/whisper.cpp/build --config Release -j 4 >/dev/null
          test -x work/whisper.cpp/build/bin/whisper-cli

      - name: Reassemble multilingual small model
        shell: bash
        run: |
          set -euo pipefail
          for suffix in aa ab ac ad ae af ag ah ai aj; do
            curl -L --fail --retry 5 --retry-all-errors --silent --show-error \
              -o "work/model/${MODEL_NAME}.part-${suffix}" \
              "https://raw.githubusercontent.com/advexplorer/whisper/refs/heads/main/${MODEL_NAME}.part-${suffix}"
          done
          cat work/model/${MODEL_NAME}.part-* > "work/model/${MODEL_NAME}"
          echo 'ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  work/model/ggml-small-q5_1.bin' | sha256sum -c -
          rm -f work/model/${MODEL_NAME}.part-*

      - name: Transcribe slice
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHUNKS < work/output/chunk-list.txt
          CLI='work/whisper.cpp/build/bin/whisper-cli'
          mkdir -p work/output/transcript
          "$CLI" \
            -m "work/model/${MODEL_NAME}" \
            -l auto \
            -t 2 -p 2 \
            -bs 5 -bo 5 \
            -mc 0 -sns \
            --prompt '한국전력공사, 전력연구원, 서울본부, 배전운영실, 동경전력 파워그리드, 東電PG, 도쿄전설서비스, TDS, 나가키정기, 콘크리트 전주, 내부진단, 비파괴진단, 철근진단기, PC강봉, 인장근, 보강근, 나선철근, 응력부식균열, SCC, 자기센서, 3축 자기센서, 자기력선, N극, S극, 관통형, 후크형, 데이터 로거, 발판볼트, 전산화번호, 동소문간10R2, 동숭동간33R6, 청운간132, 불량전주, 교체판정, 진단결과, 머신러닝, 기술교류, 공동연구, 일본 현장 적용, 수출' \
            -otxt -osrt -ojf \
            "${CHUNKS[@]}" \
            > work/output/transcript/whisper.stdout.log \
            2> work/output/transcript/whisper.stderr.log
          find work/chunks -maxdepth 1 -type f \( -name '*.txt' -o -name '*.srt' -o -name '*.json' \) -print0 \
            | xargs -0 -r -I{} mv '{}' work/output/transcript/
          printf '%s\n' '26081410_seoul_hq_pole_diagnosis1_${{ matrix.key }}' > work/output/recording-label.txt
          printf 'PASS\n' > work/output/STATUS.txt

      - name: Package and encrypt transcript
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f work/output/STATUS.txt ]; then printf 'FAIL\n' > work/output/STATUS.txt; fi
          cat > work/secure/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAonSumm0WaDpU/rfMPSzp
          PdZZz7RdwfKjgPq5zSv2bNi58lQW0Evn6Iv+EsyqTL/d6RU6DcB0cQZY/WQ/eEvt
          0roXrD5pZu9xTVR9q5AUljM/eZDYjQlDBF3HaFIKKxgR9YF8ABbo3GW+SRC4xu86
          rfUc12gUD5/bQXC3v3d15QxTnXkH9ithkVgGL4CAcuwV45lV/p6xGKTq7MKAYHOe
          mzQFx/4VEKgKVHfIw8LrHnym+w0PhhOUahYZFUcLiHizaDD6CoPpPb+dnrYmsIFW
          iv1lw2i5E38uJZl9PjuX6YHWCEhDuEI48tyhN5DzEYGiVtuaFfBeFKp64GTKShaP
          +1tOksMemT/8uuN3un4WCreP+i7UrO/2cD6Q+MU7On16mDeozt6Njgtc/68nqRI8
          AF2Qi4OmLq6Rft/HE8NvQ7shQwC3DxEzW9ohY5Lxzpi7ALkufix+mKcShyjdWyn4
          fxhVLAYRJdBy4K8IOpA7A4S1kWp5Ih1OfKni2LDSrMaTAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          tar -C work/output -czf work/secure/transcript.tar.gz .
          openssl rand -base64 48 > work/secure/passphrase.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass file:work/secure/passphrase.txt \
            -in work/secure/transcript.tar.gz \
            -out work/secure/transcript.tar.gz.enc
          openssl pkeyutl -encrypt -pubin \
            -inkey work/secure/public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in work/secure/passphrase.txt \
            -out work/secure/passphrase.rsa.enc
          printf '%s\n' '${{ matrix.key }}' > work/secure/artifact-key.txt
          rm -rf work/input.m4a work/chunks work/model work/whisper.cpp work/output \
            work/secure/transcript.tar.gz work/secure/passphrase.txt work/secure/public.pem

      - name: Upload encrypted slice result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-pole-asr-split-${{ matrix.key }}-encrypted
          path: work/secure/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
