name: Temporary Whisper model artifact

on:
  push:
    paths:
      - '.github/workflows/tmp-whisper-model-artifact.yml'
  pull_request:
    paths:
      - 'tmp-whisper-model-trigger.txt'

permissions:
  contents: read

env:
  MODEL_NAME: ggml-small-q5_1.bin

jobs:
  package-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download split model files
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p model-parts model-out
          for suffix in aa ab ac ad ae af ag ah ai aj; do
            curl -L --fail --retry 5 --retry-all-errors \
              -o "model-parts/${MODEL_NAME}.part-${suffix}" \
              "https://raw.githubusercontent.com/advexplorer/whisper/refs/heads/main/${MODEL_NAME}.part-${suffix}"
          done
          cat model-parts/${MODEL_NAME}.part-* > "model-out/${MODEL_NAME}"
          echo 'ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  model-out/ggml-small-q5_1.bin' | sha256sum -c -
          ls -lh "model-out/${MODEL_NAME}"

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5_1
          path: model-out/ggml-small-q5_1.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
